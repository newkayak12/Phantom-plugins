Reports <code>a = NULL</code> and <code>a &lt;&gt; NULL</code> in <code>WHERE</code>, <code>ON</code>, <code>HAVING</code> and <code>WHEN</code>: a comparison with NULL is never true. Use <code>IS NULL</code> or <code>IS NOT NULL</code>. Assignments in <code>SET</code> are not reported.
