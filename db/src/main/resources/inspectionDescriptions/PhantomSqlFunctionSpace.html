<body>
On MySQL and MariaDB data sources, reports a space between a built-in function name such as <code>COUNT</code>, <code>NOW</code> or <code>SUBSTRING</code> and its <code>(</code>. Unless the <code>IGNORE_SPACE</code> SQL mode is set, MySQL then looks for a stored function of that name and the query fails.
