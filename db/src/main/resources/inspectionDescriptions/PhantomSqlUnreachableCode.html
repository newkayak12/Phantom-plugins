<body>
Reports statements in a MySQL stored routine or trigger that follow <code>RETURN</code>, <code>LEAVE</code> or <code>ITERATE</code> in the same block. Control leaves the block at that statement, so the ones after it never run; the block continues only at its <code>END</code> or at the next <code>ELSE</code>, <code>ELSEIF</code>, <code>WHEN</code> or <code>UNTIL</code>.
