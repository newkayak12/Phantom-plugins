advanced.settings.phantom.workspaces=Phantom Workspaces
advanced.setting.phantom.workspaces.project.tabs=Show open projects as tabs of one window
advanced.setting.phantom.workspaces.project.tabs.description=The Projects and Files view of the Project tool window lists the open and recent projects by repository. Click one to switch to it or open it as a tab, × to close it. All project windows share one size and position, so they look like one window. With no project open, Home opens instead of the welcome window. Next/previous project: Window | Next Project Window.
advanced.setting.phantom.workspaces.sync.tool.windows=Same tool window layout in every project tab
advanced.setting.phantom.workspaces.sync.tool.windows.description=A project switched to takes the tool window layout of the one in front: stripe button sides and order, open tool windows, sizes, docked or floating. Tool windows only that project has keep their place.
