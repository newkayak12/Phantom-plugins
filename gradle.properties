# The Phantom IDEA app the plugins compile and run against; override with -PphantomIde=...
phantomIde=/Applications/Phantom IDEA.app
platformTestBuild=262.10968.63
sinceBuild=262
untilBuild=262.*

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=true
# Phantom's bundled runtime is JDK 25, which the platform requires
org.gradle.java.installations.paths=/Applications/Phantom IDEA.app/Contents/jbr/Contents/Home
kotlin.stdlib.default.dependency=false
