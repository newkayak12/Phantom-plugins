# The Phantom app the plugins compile and run against; override with -PphantomIde=...
phantomIde=/Applications/Phantom.app
platformTestBuild=262.10968.63
# Built against IntelliJ Community instead of the installed Phantom while that Phantom still bundles the same plugin id
# (http-client moved out of the core; drop it from here once an installed Phantom no longer bundles phantom-http)
platformFromRepositoryFor=http-client
sinceBuild=262
untilBuild=262.*

org.gradle.jvmargs=-Xmx2g
# The Kotlin compile daemon takes Gradle's -Xmx by default; compiling all bundled plugins in one build (Groovy and
# the rest) ran it out of memory at 2g
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
# Phantom's bundled runtime is JDK 25, which the platform requires (the second path: the app before its rename)
org.gradle.java.installations.paths=/Applications/Phantom.app/Contents/jbr/Contents/Home,/Applications/Phantom IDEA.app/Contents/jbr/Contents/Home
kotlin.stdlib.default.dependency=false
# CI runs up to every plugin at once and Maven Central answers some downloads with 429 Too Many Requests; Gradle's
# default retry (3 tries from 125 ms) gives up before the limit lifts
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
