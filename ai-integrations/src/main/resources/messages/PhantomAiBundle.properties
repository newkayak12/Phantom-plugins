hooks.consent.title=Add Phantom hooks to Claude Code and Codex?
hooks.consent.text=Session status, notifications and the Claude usage in the status bar need Phantom hooks in these files of Claude Code and Codex:<br>{0}<br>Phantom adds its own hook entries and runs the Claude status line through its script (your previous status line keeps working); everything else in the files stays. Nothing is changed until you allow it. Settings | Tools | Phantom AI Integration changes the answer, and turning it off takes the hooks out again.
hooks.consent.allow=Allow
hooks.consent.decline=Don't modify
settings.hooks=Add Phantom hooks to {0}
settings.hooks.help=Needed for session status, notifications and the Claude usage widget. Phantom adds only its own entries (and wraps the Claude status line) and keeps everything else; unticking takes them out again. Accounts added here always get the hooks, as their folders belong to Phantom.
settings.skip.permissions=Skip the agents' permission prompts
settings.skip.permissions.help=Warning: new agents start with --dangerously-skip-permissions (Claude Code) or --dangerously-bypass-approvals-and-sandbox (Codex). They then run commands, edit and delete files and use the network without asking you, and Codex leaves its sandbox. Turn it on only for worktrees you can afford to lose. Off by default.
db.consent.title=Let the Agent Read This Database?
db.consent.message=An agent asks to read the data source "{0}" ({1}, user {2}).\nTable names, columns and query results it reads go into the agent conversation and so to that agent''s AI provider (Anthropic for Claude Code, OpenAI for Codex).\nAllow agents to read this data source? Phantom asks once per data source; turning the database tools off forgets the answers.
db.consent.allow=Allow
db.consent.deny=Deny
settings.db.tools=Let agents use the Database Console data sources
settings.db.tools.help=Warning: agents can then list your saved data sources, their tables and columns, and run read-only queries. Everything these tools return, query results included, goes into the agent conversation and so to the AI provider of that agent (Anthropic for Claude Code, OpenAI for Codex) under your account and their terms. Passwords are never shown. Each data source is asked for once before agents read it. Off by default.
