Reports <code>$ref</code> values of an AsyncAPI document that point to nothing: a missing component in the same file
(<code>#/components/messages/Order</code>) or a missing file or pointer in another file (<code>messages.yaml#/Order</code>).
Remote references (<code>http://</code>, <code>https://</code>) are not checked.
