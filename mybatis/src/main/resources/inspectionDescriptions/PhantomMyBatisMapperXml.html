<html><body>
Reports problems in MyBatis mapper XML files: a <code>namespace</code> with no interface, a statement whose
<code>id</code> has no method in the mapper interface, duplicate ids, and <code>resultMap</code> or
<code>&lt;include refid&gt;</code> values that name no <code>&lt;resultMap&gt;</code> or <code>&lt;sql&gt;</code>
here or in another mapper (<code>other.Mapper.id</code>).
