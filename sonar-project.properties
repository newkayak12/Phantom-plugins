# Start with the entirely Phantom-owned Strings plugin, not upstream plugin ports.
# The workflow uses a sparse checkout because Cloud ignores source/test inclusions.
sonar.exclusions=**/build/**,**/testData/**
sonar.sourceEncoding=UTF-8
# The scoped plugin is small; do not fetch the previous whole-repository cache.
sonar.analysisCache.enabled=false
sonar.java.binaries=strings/build/classes/kotlin/main
sonar.coverage.jacoco.xmlReportPaths=strings/build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=strings/build/test-results/test
