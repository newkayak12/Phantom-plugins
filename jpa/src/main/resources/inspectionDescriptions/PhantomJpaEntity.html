Reports JPA mapping mistakes that stop the persistence unit from starting:
an <code>@Entity</code> without <code>@Id</code> or <code>@EmbeddedId</code> on itself or a superclass, and a
<code>mappedBy</code> on <code>@OneToMany</code>, <code>@OneToOne</code> or <code>@ManyToMany</code> that names an attribute the
other entity does not have.
