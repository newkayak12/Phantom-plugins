name: Inactive issues and pull requests

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stale-labels
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: ''
          stale-pr-message: ''
          exempt-issue-labels: keep-open,security,in-progress
          exempt-pr-labels: keep-open,security,in-progress
          exempt-all-milestones: true
          exempt-draft-pr: true
          remove-stale-when-updated: true
          operations-per-run: 100
