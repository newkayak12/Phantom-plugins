# Builds and tests one plugin, then publishes its zip as the GitHub release the marketplace points to.
#   tag push:  `<dir>-<version>` (e.g. kafka-0.1.1, the release tag style of .phantom/marketplace.json)
#   manual:    Actions → Plugin release → plugin=<dir>; dry_run builds and tests without touching releases
# CI has no Phantom installed, so it compiles and tests against the IntelliJ Community build Phantom is forked
# from (platformTestBuild in gradle.properties); local builds keep using the installed Phantom.
name: Plugin release

on:
  push:
    # kotlin-, maven- and java-262.<YYMMDD>: released by Phantom's phantom-release.sh, not built here; languagetool-<version>: the
    # LanguageTool language bundles Phantom Grammar downloads, published by tools/languagetool-release.sh
    tags: ['*-[0-9]*', '!kotlin-*', '!maven-*', '!java-*', '!languagetool-*']
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory (db, spring, kafka, ...)
        required: true
      dry_run:
        description: Build and test only, no release
        type: boolean
        default: true

# Build and test only read; the publish job alone writes releases
permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref_name }}-${{ inputs.plugin }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # groovy runs about 7,100 tests, a third of the time in its compiler tests (each starts a JPS build with groovyc or
    # Greclipse); they took 40 minutes on an 8-core Mac and didn't finish in 60 on the runner
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.plugin.outputs.tag }}
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0

      - name: Plugin and version
        id: plugin
        env:
          INPUT_PLUGIN: ${{ inputs.plugin }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"; dir="${tag%-*}"; expected="${tag##*-}"
          else
            dir="$INPUT_PLUGIN"; expected=""
          fi
          [[ -f "$dir/build.gradle.kts" ]] || { echo "::error::no plugin directory '$dir'"; exit 1; }
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' "$dir/build.gradle.kts")
          if [[ -n "$expected" && "$expected" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME but $dir/build.gradle.kts has version $version"; exit 1
          fi
          {
            echo "dir=$dir"
            echo "version=$version"
            echo "tag=$dir-$version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and build
        id: tests
        run: >
          xvfb-run --auto-servernum ./gradlew --no-configuration-cache -PplatformFromRepository=true
          -Porg.gradle.java.installations.paths="$JAVA_HOME"
          :${{ steps.plugin.outputs.dir }}:test :${{ steps.plugin.outputs.dir }}:buildPlugin

      - name: Test report
        if: always()
        env:
          PLUGIN: ${{ steps.plugin.outputs.dir }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 tools/test-summary.py "$PLUGIN" --outcome "$TEST_OUTCOME"

      - name: Check packaged licenses and notices
        env:
          PLUGIN: ${{ steps.plugin.outputs.dir }}
          TAG: ${{ steps.plugin.outputs.tag }}
        run: python3 tools/check-plugin-notices.py "$PLUGIN/build/distributions/$TAG.zip"

      - name: Prepare corresponding source archives
        id: sources
        if: steps.plugin.outputs.dir == 'grammar' || steps.plugin.outputs.dir == 'coverage'
        env:
          TAG: ${{ steps.plugin.outputs.tag }}
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/plugin-sources.XXXXXX")"
          bash tools/attach-sources.sh "$TAG" --download-dir "$directory"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"

      - name: Preserve release test reports
        if: always() && steps.plugin.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-results-${{ steps.plugin.outputs.tag }}
          path: |
            ${{ steps.plugin.outputs.dir }}/build/test-results/test/
            ${{ steps.plugin.outputs.dir }}/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Release files
        env:
          ZIP: ${{ steps.plugin.outputs.dir }}/build/distributions/${{ steps.plugin.outputs.tag }}.zip
          SOURCES: ${{ steps.sources.outputs.directory }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp "$ZIP" "$RUNNER_TEMP/release/"
          if [[ -n "$SOURCES" ]]; then cp "$SOURCES/"*.jar "$RUNNER_TEMP/release/"; fi
          ls -l "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plugin.outputs.tag }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.build.outputs.tag }}
          path: release

      # Phantom pins each bundled zip by sha256, so a published zip is never replaced: a release that already holds
      # it passes only when this build's zip has the same bytes (a rerun), and only files it lacks are added (e.g.
      # sources missing from a release made by hand). Changed contents need a new version.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd release
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" ./* --title "$TAG" --notes "Built by GitHub Actions from $GITHUB_SHA"
          else
            published="$(gh release view "$TAG" --json assets -q '.assets[].name')"
            if grep -qxF "$TAG.zip" <<< "$published"; then
              gh release download "$TAG" -p "$TAG.zip" -O "$RUNNER_TEMP/published.zip"
              cmp -s "$TAG.zip" "$RUNNER_TEMP/published.zip" \
                || { echo "::error::$TAG.zip is already published with different contents; release a new version"; exit 1; }
            fi
            missing=()
            for f in *; do grep -qxF "$f" <<< "$published" || missing+=("$f"); done
            if (( ${#missing[@]} )); then gh release upload "$TAG" "${missing[@]}"; fi
          fi
          # every built file (the zip and any corresponding sources NOTICE promises) must be on the release
          published="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          for f in *; do grep -qxF "$f" <<< "$published" || { echo "::error::$f is missing from release $TAG"; exit 1; }; done
