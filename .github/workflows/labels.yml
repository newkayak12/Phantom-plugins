name: Phantom plugins labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/labels.json, .github/workflows/labels.yml]
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: phantom-labels-${{ github.event.pull_request.number || github.event.issue.number || 'sync' }}
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Metadata only: never check out PR code or read its version of the config.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: '.github/labels.json', ref: repository.default_branch,
            });
            const config = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100,
            });
            const byName = new Map(existing.map(label => [label.name.toLowerCase(), label]));
            const sync = ['push', 'workflow_dispatch'].includes(context.eventName);
            // Create/update only configured labels. Never delete unrelated labels.
            for (const label of config.labels) {
              const old = byName.get(label.name.toLowerCase());
              if (!old) {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: label.name, color: label.color, description: label.description,
                  });
                } catch (error) {
                  // Concurrent issue/PR runs may create the same label first.
                  if (error.status !== 422 || !error.response?.data?.errors?.some(item => item.code === 'already_exists')) {
                    throw error;
                  }
                }
              } else if (sync && (old.color !== label.color || old.description !== label.description)) {
                await github.rest.issues.updateLabel({
                  owner, repo, name: old.name, color: label.color, description: label.description,
                });
              }
            }
            if (sync) {
              core.info('Configured labels synchronized; unrelated labels preserved.');
              return;
            }

            const issue_number = context.issue.number;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const title = issue.title.trim().toLowerCase();
            let paths = [];
            if (context.eventName === 'pull_request_target') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: issue_number, per_page: 100,
              });
              paths = files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
              if (files.length >= 3000) core.warning('GitHub caps PR files at 3000; labels may be incomplete.');
            }
            const current = new Set(issue.labels.map(label => label.name.toLowerCase()));
            const labels = config.labels.filter(label =>
              (label.titlePrefixes ?? []).some(prefix => title.startsWith(prefix)) ||
              (label.paths ?? []).some(pattern => paths.some(path => new RegExp(pattern).test(path)))
            ).map(label => label.name).filter(name => !current.has(name.toLowerCase()));
            // Additive labeling preserves manual decisions, including labels after later edits.
            if (labels.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
              core.info(`Added labels: ${labels.join(', ')}`);
            }
