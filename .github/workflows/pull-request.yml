# Kotlin style and static analysis; plugin tests and packaging run in dedicated workflows.
name: Pull request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kotlin-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Spotless and detekt
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base=origin/main; fi
          ./gradlew --no-configuration-cache -PplatformFromRepository=true \
            -Porg.gradle.java.installations.paths="$JAVA_HOME" "-PspotlessRatchetFrom=$base" spotlessCheck detekt
