name: Plugin quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a5914442 # v5.0.0
        with:
          node-version: '22'
      - name: Test quality tooling
        run: node --test tools/phantom-quality.test.mjs
      - name: Install script and workflow analyzers
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck zsh
          GOBIN="$HOME/.local/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check changed scripts and whitespace
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base=origin/main; fi
          node tools/phantom-quality.mjs --lint --base "$base"
