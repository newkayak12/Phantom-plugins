name: Affected plugin tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: affected-plugin-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plugins.outputs.matrix }}
      has_plugins: ${{ steps.plugins.outputs.has_plugins }}
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect affected plugin modules
        id: plugins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args])

          base = os.environ['BASE_SHA']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', base):
              raise SystemExit('Expected a full base commit SHA from the GitHub event.')
          if set(base) == {'0'}:
              changed = git('diff-tree', '--root', '--no-commit-id', '--name-only', '--no-renames', '-r', '-z', 'HEAD')
          else:
              ancestor = git('merge-base', base, 'HEAD').decode().strip()
              changed = git('diff', '--name-only', '--no-renames', '-z', ancestor, 'HEAD', '--')
          paths = changed.decode('utf-8', errors='surrogateescape').split('\0')
          registered = set(re.findall(r'^include\("([a-z][a-z0-9-]*)"\)', Path('settings.gradle.kts').read_text(), re.MULTILINE))
          modules = set()
          packaging = set()
          shared = False
          for path in paths:
              if path in {'settings.gradle.kts', 'gradle.properties', 'gradlew', 'gradlew.bat'} or path.startswith(('buildSrc/', 'gradle/')):
                  shared = True
              parts = path.split('/', 1)
              if len(parts) != 2:
                  continue
              module, relative = parts
              if module == 'strings' or module not in registered:
                  continue
              if relative != 'build.gradle.kts' and not relative.startswith('src/'):
                  continue
              folder = Path(module)
              if not folder.is_symlink() and (folder / 'build.gradle.kts').is_file() and (folder / 'src').is_dir():
                  modules.add(module)
                  packaging.add(module)
          if shared:
              # only plugins with sources, as for changed files above: java has none (it repackages the Java plugin
              # Phantom publishes, and its test runs in plugin-release.yml) and no verifyPlugin task
              modules.update(m for m in registered - {'strings'} if not Path(m).is_symlink() and (Path(m) / 'src').is_dir())
              packaging.update(modules)
          plugins = sorted(modules)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': [{'plugin': module, 'package': module in packaging} for module in plugins]}) + '\n')
              output.write('has_plugins=' + str(bool(plugins)).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Affected plugin tests\n')
              summary.write('Selected modules: ' + (', '.join(plugins) or 'none') + '.\n')
              summary.write('Strings tests run separately in Plugin analysis. Documentation-only changes do not select modules.\n')
              summary.write('Selected plugins are tested and packaged as ZIP archives.\n')
              if shared:
                  summary.write('Shared build configuration changed: all normally registered plugins are selected; Strings runs in analysis CI. Conditional real-IDE probes are excluded.\n')
          PY

  test:
    name: Plugin tests (${{ matrix.plugin }})
    needs: detect
    if: needs.detect.outputs.has_plugins == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test affected plugin
        id: tests
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          [[ "$PLUGIN" =~ ^[a-z][a-z0-9-]*$ && -f "$PLUGIN/build.gradle.kts" && -d "$PLUGIN/src" ]]
          xvfb-run --auto-servernum ./gradlew --no-configuration-cache \
            -PplatformFromRepository=true -Porg.gradle.java.installations.paths="$JAVA_HOME" \
            ":$PLUGIN:test"
      - name: Summarize plugin tests
        if: always()
        env:
          PLUGIN: ${{ matrix.plugin }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: python3 tools/test-summary.py "$PLUGIN" --outcome "$TEST_OUTCOME"
      - name: Build changed plugin packaging
        if: matrix.package == true
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: >-
          ./gradlew --no-configuration-cache -PplatformFromRepository=true
          -Porg.gradle.java.installations.paths="$JAVA_HOME" ":$PLUGIN:buildPlugin"
      - name: Check packaged licenses and notices
        if: matrix.package == true
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: python3 tools/check-plugin-notices.py "$PLUGIN"/build/distributions/*.zip
      # Plugin Verifier: the built plugin's bytecode against the IntelliJ Community build Phantom is forked from.
      # (Against a Phantom build too once its product-info.json lists module jars where they are; see the PR.)
      - name: Verify plugin
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: >-
          ./gradlew --no-configuration-cache -PplatformFromRepository=true
          -Porg.gradle.java.installations.paths="$JAVA_HOME" ":$PLUGIN:verifyPlugin"
      - name: Preserve plugin archive
        if: matrix.package == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-archive-${{ matrix.plugin }}
          path: ${{ matrix.plugin }}/build/distributions/*.zip
          if-no-files-found: error
      - name: Preserve available test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-tests-${{ matrix.plugin }}
          path: |
            ${{ matrix.plugin }}/build/test-results/test/
            ${{ matrix.plugin }}/build/reports/tests/test/
          if-no-files-found: warn
