Reports <code>@Bean(initMethod = ...)</code> and <code>@Bean(destroyMethod = ...)</code> naming a method the bean type does not have, or one with parameters. An init method takes no parameters; a destroy method none or a single <code>boolean</code>. Checked only when the <code>@Bean</code> method declares a concrete class.
