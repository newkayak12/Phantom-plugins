Reports <code>@Value</code> literals without placeholders or SpEL that Spring cannot convert to the injected number, boolean or char, such as <code>@Value("ten") int retries</code>. Conversion follows Spring's defaults: whitespace is ignored, hexadecimal numbers and <code>on</code>/<code>off</code>/<code>yes</code>/<code>no</code> are accepted.
