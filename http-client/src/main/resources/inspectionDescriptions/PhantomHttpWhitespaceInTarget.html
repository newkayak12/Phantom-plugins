Reports spaces inside the URL of a request line, such as <code>GET /search?q=a b</code>. The parts of the URL are joined without the whitespace (it separates continuation lines), so <code>a b</code> is sent as <code>ab</code>. Encode a space as <code>%20</code> or <code>+</code>.
